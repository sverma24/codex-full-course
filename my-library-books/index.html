<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Library Books</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header>
    <h1>My Library Books</h1>
    <p>Fernhollow Public Library</p>
    <p id="overdue-count"></p>
  </header>

  <main>
    <section id="due-soon" aria-labelledby="due-soon-heading" hidden>
      <h2 id="due-soon-heading">Due soon</h2>
      <ul id="due-soon-books"></ul>
    </section>
    <p class="total">Late fees owed: <span id="total">$0.00</span></p>
    <button type="button" id="export">Export CSV</button>
    <input id="search" type="search" placeholder="Search by title or author" aria-label="Search books by title or author">
    <ul id="books"></ul>

    <form id="add">
      <h2>Add a book</h2>
      <input name="title" placeholder="Title">
      <input name="author" placeholder="Author">
      <input name="due" type="date">
      <button>Add</button>
    </form>
  </main>

  <script src="books.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
